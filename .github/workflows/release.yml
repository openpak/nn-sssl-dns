name: release
# Tag v1.2.3 and this publishes ghcr.io/openpak/nn-sssl-dns (the DNS server only; TLS is
# terminated by OpenPak's Traefik, so upstream's nginx half is not built).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    # The light self-hosted runner (no heavy label needed): podman + qemu binfmt, as the website.
    runs-on: [self-hosted, linux, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Scratch in the runner's temp, not the machine's shared /tmp
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          echo "TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json # job-scoped login; never the runner user's own
      - run: |
          set -e
          IMG="ghcr.io/${{ github.repository }}"
          case "${GITHUB_REF_NAME}" in v*) VER="${GITHUB_REF_NAME#v}";; *) VER="";; esac
          podman manifest rm "$IMG:build" 2>/dev/null || true
          podman build --platform linux/amd64,linux/arm64 --manifest "$IMG:build" dns
          TAGS="latest"; [ -n "$VER" ] && TAGS="$TAGS $VER"
          for t in $TAGS; do podman manifest push --all "$IMG:build" "docker://$IMG:$t"; done
          podman manifest rm "$IMG:build"
          echo "pushed $IMG: $TAGS"
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json # job-scoped login; never the runner user's own
      - name: Clear scratch
        if: always()
        run: rm -rf "$RUNNER_TEMP/scratch"
